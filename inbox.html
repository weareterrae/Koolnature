<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EKOOLOGY — Inbox</title>
</head>
<body style="margin:0">
  <div style="font-family:-apple-system,'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F7FC">
    <div style="text-align:center;max-width:460px;padding:48px 32px">
      <div id="ico" style="font-size:56px">🔥</div>
      <h1 id="msg" style="color:#00379E;font-weight:700;font-size:28px;line-height:1.35">A processar…</h1>
      <p style="color:#F25C1B;letter-spacing:2px;text-transform:uppercase;font-size:12px;margin-top:22px;font-weight:700">EKOOLOGY · Cada grelhada limpa a floresta</p>
      <p style="color:#5A6478;font-size:13px">Podes fechar esta página.</p>
    </div>
  </div>
<script>
  var p = new URLSearchParams(location.search);
  var ok = p.get("ok") === "1";
  document.getElementById("ico").textContent = ok ? "🔥" : "⚠️";
  document.getElementById("msg").textContent = p.get("m") || (ok ? "Enviado!" : "Algo correu mal.");
</script>
</body>
</html>
